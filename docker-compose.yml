services:
  server:
    build: ./server
    ports:
      - "3098:3001"
    environment:
      - DB_PATH=/app/data/aac.db
    volumes:
      # Live-reload: your local source overrides the copy baked into the image.
      - ./server:/app
      # ...but keep the image's own node_modules (don't let the bind mount above hide it).
      - /app/node_modules
      # Persist the SQLite file in a named volume so it survives rebuilds.
      - aac-db-data:/app/data
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "3010:3000"
    environment:
      # Needed for CRA/Vite dev servers to pick up file changes inside Docker.
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    restart: unless-stopped


volumes:
  aac-db-data: